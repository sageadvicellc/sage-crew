name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The sanitizer reads the messages of every commit in the range.
          fetch-depth: 0
          persist-credentials: false

      # The maintainer approved this pin on 2026-09-28.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The engines floor is major version 24.
      - name: Check the Node version
        run: |
          major="$(node --version | sed -E 's/^v([0-9]+).*/\1/')"
          echo "node $(node --version)"
          if [ "$major" -lt 24 ]; then
            echo "::error::Node 24 or later is required. Found major version $major."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The sanitizer runs in its own job, and no code from the branch runs
  # here. The sanitizer comes from the base commit: the pull request's base,
  # or the default branch on a push. The branch is checked out only as
  # data: git reads its files, its diffs, and its commit messages. A branch
  # that changes the sanitizer or the sanitize script cannot change this
  # check, and the deny-list secret never reaches a job that runs branch
  # code.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sanitizer from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: base
          persist-credentials: false

      - name: Check out the branch as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          # The sanitizer reads the messages of every commit in the range.
          fetch-depth: 0
          persist-credentials: false

      # The maintainer approved this pin on 2026-09-28.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The deny-list is never committed. It lives in a repository secret.
      # The secret reaches this step as an environment variable and goes
      # straight to a file, so it never appears in the log. When the secret
      # is missing, no file is written and the sanitize step fails closed.
      - name: Write the deny-list
        env:
          SANITIZE_DENYLIST_CONTENT: ${{ secrets.SANITIZE_DENYLIST_CONTENT }}
        run: |
          if [ -n "$SANITIZE_DENYLIST_CONTENT" ]; then
            printf '%s\n' "$SANITIZE_DENYLIST_CONTENT" > "$RUNNER_TEMP/denylist.txt"
          fi

      # Node loads the sanitizer from base/, which needs no installed
      # package. The working folder is the branch, so git reads it as data.
      # No npm script, hook, or file from the branch runs.
      - name: Sanitize the branch
        working-directory: head
        env:
          SANITIZE_REQUIRE_DENYLIST: "1"
          SANITIZE_DENYLIST: ${{ runner.temp }}/denylist.txt
          SANITIZE_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node "$GITHUB_WORKSPACE/base/src/sanitize/run.ts"
