name: sanitize

# The sanitizer runs in its own workflow. On a pull request it uses
# pull_request_target, so GitHub always runs this file as it is on the base
# branch, never a copy the branch changed. The deny-list secret reaches
# only this file. The sanitizer and its allowlist come from the base
# commit, and the branch is checked out by its head commit only as data:
# git reads its files, its diffs, and its commit messages, and nothing in
# the branch runs. A push to main runs main's own copy of this file.
on:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the sanitizer from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false

      - name: Check out the branch as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          # The sanitizer reads the messages of every commit in the range.
          fetch-depth: 0
          persist-credentials: false

      # The maintainer approved this pin on 2026-09-28.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The deny-list is never committed. It lives in a repository secret.
      # The secret reaches this step as an environment variable and goes
      # straight to a file, so it never appears in the log. When the secret
      # is missing, no file is written and the sanitize step fails closed.
      # A pull request from a fork never gets the secret: its public log
      # would name the deny-list line of each guessed term that matched.
      - name: Write the deny-list
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SANITIZE_DENYLIST_CONTENT: ${{ secrets.SANITIZE_DENYLIST_CONTENT }}
        run: |
          if [ -n "$SANITIZE_DENYLIST_CONTENT" ]; then
            printf '%s\n' "$SANITIZE_DENYLIST_CONTENT" > "$RUNNER_TEMP/denylist.txt"
          fi

      # Node loads the sanitizer from base/, which needs no installed
      # package. The working folder is the branch, so git reads it as data.
      # No npm script, hook, or file from the branch runs.
      - name: Sanitize the branch
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: head
        env:
          SANITIZE_REQUIRE_DENYLIST: "1"
          SANITIZE_DENYLIST: ${{ runner.temp }}/denylist.txt
          SANITIZE_ALLOWLIST: ${{ github.workspace }}/base/.sanitize-allow
          SANITIZE_RANGE: ${{ github.event_name == 'pull_request_target' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node "$GITHUB_WORKSPACE/base/src/sanitize/run.ts"

      # A fork gets the other four checks with no deny-list, and then the
      # job fails, because the deny-list scan has not run.
      - name: Sanitize a fork without the deny-list
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        working-directory: head
        env:
          SANITIZE_ALLOWLIST: ${{ github.workspace }}/base/.sanitize-allow
          SANITIZE_RANGE: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        run: |
          node "$GITHUB_WORKSPACE/base/src/sanitize/run.ts" || true
          echo "the deny-list scan runs after a maintainer moves the branch into this repository"
          exit 1
